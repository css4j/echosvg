# Build workflow

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  build:

    # Many tests only pass on Windows
    runs-on: windows-latest

    strategy:
      matrix:
        java: [ '11', '21', '25' ]

    name: Java ${{ matrix.java }} build

    steps:
      # Check-out the repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v7

      # Set JDK
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      # setup-gradle validates the wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.5'

      # Build
      - name: Build with Gradle
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          ./gradlew build

      # Upload test artifact
      - name: Upload test output
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-output-${{ matrix.java }}
          path: |
            echosvg-test/build/reports/tests/test/
            test-references/samples/**/candidate-variation/*
          retention-days: 15
          overwrite: true

      # Generate modular javadocs
      - name: Modular javadocs
        if: ${{ success() && (matrix.java == '21') }}
        run: ./gradlew modularJavadoc
