<!-- ========================================================================= -->
<!--  Test CSS-specified shapes                                                -->
<!--                                                                           -->
<!-- Based on 'shapes/zero.svg' test by tkormann@apache.org                    -->
<!-- @author see Git history                                                   -->
<!-- @version $Id$ -->
<!-- ========================================================================= -->

<?xml-stylesheet type="text/css" href="../../resources/style/test.css" ?>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"  id="body" width="450" height="500" viewBox="0 0 450 500">
<title>Test CSS-specified shape properties</title>
    <!-- ============================================================= -->
    <!-- Test content                                                  -->
    <!-- ============================================================= -->
<g id="testContent">
  <text x="225" y="30" class="title">Test CSS-specified shape properties</text>
  <text x="225" y="50" class="title">CSS-specified x,y,cx,cy,etc. take precedence over attributes</text>

<!-- dashboard -->
<g style="stroke:black; fill:none;">
        <rect style="x:40px; y:80px; width:360px; height:120px;" />
        <rect style="x:40px; y:200px; width:360px; height:120px" />
        <rect style="x:40px; y:320px; width:360; height:120px" />
</g>
<g style="fill:rgb(240, 240, 240); stroke:black;">
        <rect style="x:40px; y:80px; width:20px; height:120px;" />
        <rect style="x:40px; y:200px; width:20px; height:120px;" />
        <rect style="x:40px; y:320px; width:20px; height:120px;" />
        <g style="stroke:none; fill:black; font-size:12pt; font-family:'Open Sans'">
                <text transform="translate(55, 170) rotate(-90)">&lt;rect></text>
                <text transform="translate(55, 290) rotate(-90)">&lt;circle></text>
                <text transform="translate(55, 410) rotate(-90)">&lt;ellipse></text>
        </g>
</g>

<!-- ########### rect ############# -->
<g style="stroke:none; fill:springgreen">
        <rect style="x:90px; y:calc(50px + 45px); width:80px;" width="40" height="70" />
        <rect style="x:195px; y:95px; height:80px;" width="70" height="40" />
        <rect style="x:290px; y:95px; width:80px; height:80px;" width="40" height="40" />
</g>
<g style="stroke:none; fill:black; font-size:12px; font-family:'Open Sans'; text-anchor:middle">
        <text x="130" y="194">CSS width</text>
        <text x="230" y="194">CSS height</text>
        <text x="330" y="194">All in CSS</text>
</g>

<!-- ########### circle ############# -->
<g style="stroke:none; fill:lightseagreen">
        <circle style="cx:155px; cy:255px; r:40px;" r="25"/>
        <circle style="cx:305px; cy:255px;" r="40"/>
</g>
<g style="stroke:none; fill:black; font-size:12px; font-family:'Open Sans'; text-anchor:middle">
        <text x="155" y="314">CSS r</text>
        <text x="305" y="314">Attribute r</text>
</g>

<!-- ########### ellipse ############# -->
<g style="stroke:none; fill:lightgreen">
        <ellipse style="cx:130px; cy:370px; ry:30px;" />
        <ellipse style="cx:230px; rx:40px;" cy="370" />
        <ellipse style="cx:330px; cy:370px; rx:30px; ry:40px;" />
</g>
<g style="stroke:none; fill:black; font-size:12px; font-family:'Open Sans'; text-anchor:middle">
        <text x="130" y="430">missing rx</text>
        <text x="230" y="430">missing ry, attr cy</text>
        <text x="330" y="430">Has both rx &amp; ry</text>
</g>

</g>

</svg>
