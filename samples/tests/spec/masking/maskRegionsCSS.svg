<!-- ========================================================================= -->
<!-- Validates processing of mask regions, uses geometry properties            -->
<!--                                                                           -->
<!-- Based on maskRegions.svg by Vincent Hardy                                 -->
<!-- ========================================================================= -->

<?xml-stylesheet type="text/css" href="../../resources/style/test.css" ?>

<svg xmlns="http://www.w3.org/2000/svg" id="body" width="450" height="500" viewBox="0 0 450 500">
<title>Mask (Geometry properties)</title>
    <!-- ============================================================= -->
    <!-- Test content                                                  -->
    <!-- ============================================================= -->
    <g id="testContent" class="legend" text-anchor="middle">
        <text x="225" y="50" class="title">
        Mask Regions
        </text>

        <defs>

        <!-- ======================================== -->
        <!-- Masked object definition                 -->
        <!-- ======================================== -->
        <linearGradient id="maskedGradient" x1="0" x2="1" y1="0" y2="1" color-interpolation="linearRGB">
            <stop offset="0" stop-color="blue" />
            <stop offset="1" stop-color="red" />
        </linearGradient>

        <rect id="masked" style="width:100px;height:80px" fill="url(#maskedGradient)" />

        <!-- ======================================= -->
        <!-- maskUnits: default                      -->
        <!-- maskContentUnits: default               -->
        <!-- maskRegion: default (-.1, -.1, 1.2, 1.2)-->
        <!-- ======================================= -->
        <mask id="mask_1">
            <circle style="cx:25;cy:20;r:20" fill="#ffffff" />
            <circle style="cx:25;cy:60;r:calc(2*10)" fill="#ffffff" />
            <circle style="cx:75;cy:20;r:20" cx="50" cy="15" r="30" fill="#ffffff" />
            <circle style="cx:75;cy:60;r:20" fill="#ffffff" />
        </mask>

        <!-- ======================================= -->
        <!-- maskUnits: objectBoundingBox            -->
        <!-- maskContentUnits: default               -->
        <!-- maskRegion: (.25, .25, .5, .5)          -->
        <!-- ======================================= -->
        <mask id="mask_2" maskUnits="objectBoundingBox"
              x=".25" y="25%" width="50%" height=".5">
            <circle style="cx:25;cy:20;r:20" fill="#ffffff" />
            <circle style="cx:25;cy:calc(20 + 40);r:20" fill="#ffffff" />
            <circle style="cx:75;cy:20;r:20" fill="#ffffff" />
            <circle style="cx:75;cy:60;r:20" fill="#ffffff" />
        </mask>

        <!-- ======================================= -->
        <!-- maskUnits: userSpaceOnUse               -->
        <!-- maskContentUnits: default               -->
        <!-- maskRegion: (25, 25, 50, 50)            -->
        <!-- ======================================= -->
        <mask id="mask_3" maskUnits="userSpaceOnUse"
              x="25" y="20" width="11.11111111%" height="8%">
            <circle style="cx:calc(20 + 5);cy:20;r:20" fill="#ffffff" />
            <circle style="cx:25;cy:60;r:20" fill="#ffffff" />
            <circle style="cx:75;cy:20;r:20" fill="#ffffff" />
            <circle style="cx:75;cy:60;r:20" fill="#ffffff" />
        </mask>

        <!-- ======================================= -->
        <!-- maskUnits: objectBoundingBox            -->
        <!-- maskContentUnits: default               -->
        <!-- maskRegion: (25, 25, 50, 50)            -->
        <!-- ======================================= -->
        <mask id="mask_4" maskUnits="objectBoundingBox"
              maskContentUnits="objectBoundingBox"
              x="0" y="0" width="100%" height="100%">
            <circle style="cx:.25;cy:.2;r:.2" fill="#ffffff" />
            <circle style="cx:.25;cy:.6;r:.2" fill="#ffffff" />
            <circle style="cx:.75;cy:.2;r:.2" fill="#ffffff" />
            <circle style="cx:.75;cy:.6;r:.2" cx=".4" cy=".1" r=".3" fill="#ffffff" />
        </mask>

        </defs>

        <g transform="translate(175, 100)">
            <use href="#masked" />
            <text x="50" y="-3">Masked</text>
        </g>

        <g transform="translate(85, 220)">
            <use href="#masked" mask="url(#mask_1)"/>
            <text x="50" y="-3">Mask 1</text>
        </g>

        <g transform="translate(85, 340)">
            <use href="#masked" mask="url(#mask_2)"/>
            <text x="50" y="-3">Mask 2</text>
        </g>

        <g transform="translate(260, 220)">
            <use href="#masked" mask="url(#mask_3)"/>
            <text x="50" y="-3">Mask 3</text>
        </g>

        <g transform="translate(260, 340)">
            <use href="#masked" mask="url(#mask_4)"/>
            <text x="50" y="-3">Mask 4</text>
        </g>

    </g>

    <!-- ============================================================= -->
    <!-- EchoSVG sample mark                                             -->
    <!-- ============================================================= -->
    <use href="../../../batikLogo.svg#EchoSVG_Tag_Box" />

</svg>
